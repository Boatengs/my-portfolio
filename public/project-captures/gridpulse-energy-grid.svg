<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">GridPulse PJM forecast benchmark</title>
  <desc id="desc">Portfolio visual summarizing GridPulse energy demand forecasting results, including forty-four point two percent lower overall MAE and thirteen of thirteen rolling validation folds beating the EIA benchmark.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="46" y="42" width="1108" height="591" rx="28" fill="#f8fafb" stroke="#dbe5e8" stroke-width="2"/>
  <text x="88" y="108" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="4" fill="#157b79">GRIDPULSE</text>
  <text x="88" y="157" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#17252a">PJM demand · EIA forecast · ML correction</text>
  <text x="88" y="191" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5f7078">Verified 2025 out-of-time benchmark · EIA-930 hourly operations</text>

  <g transform="translate(88 246)">
    <line x1="0" y1="240" x2="700" y2="240" stroke="#cfdadd" stroke-width="2"/>
    <line x1="0" y1="160" x2="700" y2="160" stroke="#e5ecee" stroke-width="1"/>
    <line x1="0" y1="80" x2="700" y2="80" stroke="#e5ecee" stroke-width="1"/>
    <path d="M0 205 C55 180 85 198 135 145 S235 120 280 104 S360 50 405 88 S485 110 525 62 S615 18 700 54" fill="none" stroke="#17252a" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 222 C55 205 95 170 135 176 S225 142 280 132 S355 82 405 106 S485 132 525 91 S610 52 700 85" fill="none" stroke="#98a8ad" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
    <path d="M0 211 C55 190 98 188 135 151 S230 127 280 111 S360 58 405 92 S483 114 525 69 S611 26 700 59" fill="none" stroke="#157b79" stroke-width="5" stroke-linecap="round"/>
    <circle cx="525" cy="69" r="8" fill="#157b79"/>
    <text x="0" y="278" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f7078">PJM operating window around annual peak demand</text>
  </g>

  <g transform="translate(830 246)">
    <rect width="282" height="108" rx="18" fill="#ffffff" stroke="#dbe5e8" stroke-width="2"/>
    <text x="24" y="40" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#157b79">44.2%</text>
    <text x="24" y="72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17252a">LOWER OVERALL MAE</text>
    <text x="24" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6c7b81">vs EIA day-ahead · 2025 holdout</text>

    <rect y="128" width="282" height="108" rx="18" fill="#ffffff" stroke="#dbe5e8" stroke-width="2"/>
    <text x="24" y="168" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#157b79">36.0%</text>
    <text x="24" y="200" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17252a">LOWER PEAK MAE</text>
    <text x="24" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6c7b81">shared top-decile demand threshold</text>

    <rect y="256" width="282" height="108" rx="18" fill="#17252a"/>
    <text x="24" y="298" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#ffffff">13 / 13</text>
    <text x="24" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">FUTURE FOLDS WON</text>
    <text x="24" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#c8d3d6">overall + peak MAE vs EIA</text>
  </g>

  <g transform="translate(88 573)">
    <circle cx="7" cy="7" r="7" fill="#17252a"/>
    <text x="24" y="13" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#44555b">Actual demand</text>
    <line x1="154" y1="7" x2="184" y2="7" stroke="#98a8ad" stroke-width="4" stroke-dasharray="7 7"/>
    <text x="196" y="13" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#44555b">EIA forecast</text>
    <line x1="320" y1="7" x2="350" y2="7" stroke="#157b79" stroke-width="4"/>
    <text x="362" y="13" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#44555b">GridPulse correction</text>
  </g>
</svg>
