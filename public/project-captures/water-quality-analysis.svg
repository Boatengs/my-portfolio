<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Water Quality Analysis monitoring visual</title>
  <desc id="desc">A realistic environmental monitoring scene with reservoir, sensor station, site map, water-quality trend chart, and anomaly alert.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2436"/><stop offset="1" stop-color="#244c59"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#236a78"/><stop offset="1" stop-color="#0a2f3a"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#102633" stop-opacity=".97"/><stop offset="1" stop-color="#08161e" stop-opacity=".98"/></linearGradient>
    <linearGradient id="sensor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f7f8"/><stop offset="1" stop-color="#9aa9ae"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="210" cy="120" r="150" fill="#5b8390" opacity=".11"/>
  <path d="M0 335 C130 250 260 268 390 318 C500 360 590 318 700 286 L700 470 L0 470Z" fill="#17353c"/>
  <path d="M0 385 C150 312 265 338 385 365 C520 395 595 350 700 335 L700 500 L0 500Z" fill="#234b4f"/>
  <rect y="430" width="710" height="370" fill="url(#water)"/>
  <path d="M0 500 C115 482 220 520 330 501 C450 480 555 515 710 488" fill="none" stroke="#76c9d1" stroke-opacity=".22" stroke-width="3"/>
  <path d="M0 590 C120 570 248 610 360 585 C485 557 580 602 710 578" fill="none" stroke="#b3eef1" stroke-opacity=".14" stroke-width="2"/>
  <path d="M0 680 C125 660 230 690 350 674 C485 655 575 694 710 668" fill="none" stroke="#8cd9df" stroke-opacity=".12" stroke-width="2"/>

  <g transform="translate(58 450)" filter="url(#shadow)">
    <ellipse cx="132" cy="245" rx="98" ry="19" fill="#041016" opacity=".35"/>
    <rect x="83" y="75" width="100" height="185" rx="22" fill="url(#sensor)"/>
    <rect x="101" y="102" width="64" height="38" rx="8" fill="#19323d"/>
    <circle cx="133" cy="121" r="9" fill="#63d8dd" filter="url(#glow)"/>
    <rect x="117" y="22" width="31" height="62" rx="7" fill="#1b2d33"/>
    <rect x="129" y="-12" width="8" height="39" rx="4" fill="#0b161b"/>
    <path d="M133 2 C102 -22 84 -6 74 6 M133 2 C164 -22 182 -6 192 6" fill="none" stroke="#60d9de" stroke-width="4" stroke-linecap="round" opacity=".75"/>
    <rect x="94" y="184" width="78" height="10" rx="5" fill="#53676c"/>
    <text x="133" y="166" text-anchor="middle" fill="#243c43" font-size="17" font-family="Arial,sans-serif" font-weight="700">SENSOR</text>
  </g>

  <g opacity=".75">
    <circle cx="190" cy="570" r="76" fill="none" stroke="#59d4d9" stroke-width="3" stroke-opacity=".28"/>
    <circle cx="190" cy="570" r="118" fill="none" stroke="#59d4d9" stroke-width="2" stroke-opacity=".16"/>
    <path d="M267 558 C340 528 385 500 445 474" fill="none" stroke="#65e0e4" stroke-width="2" stroke-dasharray="6 8"/>
    <circle cx="445" cy="474" r="6" fill="#65e0e4"/>
  </g>

  <text x="55" y="90" fill="#ffffff" font-family="Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="2">WATER QUALITY</text>
  <text x="58" y="132" fill="#68d9dd" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">ANOMALY DETECTION</text>
  <line x1="58" y1="151" x2="245" y2="151" stroke="#68d9dd" stroke-width="3"/>

  <g transform="translate(650 55)" filter="url(#shadow)">
    <rect width="500" height="690" rx="28" fill="url(#panel)" stroke="#6bbbc3" stroke-opacity=".22"/>
    <text x="28" y="44" fill="#dff8f8" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">MONITORING VIEW</text>
    <text x="360" y="44" fill="#ff9b6b" font-family="Arial,sans-serif" font-size="14" font-weight="700">ANOMALY FLAG</text>

    <g transform="translate(28 70)">
      <rect width="290" height="174" rx="18" fill="#0d1d26" stroke="#75d0d5" stroke-opacity=".18"/>
      <path d="M18 131 C65 113 75 67 125 84 C171 100 176 45 234 58 C255 63 268 54 278 42" fill="none" stroke="#3d7d84" stroke-width="18" stroke-linecap="round" opacity=".8"/>
      <circle cx="55" cy="118" r="7" fill="#5ed8db"/><circle cx="123" cy="84" r="7" fill="#5ed8db"/><circle cx="195" cy="72" r="7" fill="#5ed8db"/><circle cx="252" cy="55" r="10" fill="#ff6b58" filter="url(#glow)"/>
      <text x="18" y="28" fill="#9fc2c8" font-family="Arial,sans-serif" font-size="13" font-weight="700">SITE NETWORK</text>
      <text x="240" y="80" fill="#ff9a86" font-family="Arial,sans-serif" font-size="11">ALERT</text>
    </g>

    <g transform="translate(334 70)">
      <rect width="138" height="174" rx="18" fill="#14232b" stroke="#ff775f" stroke-opacity=".34"/>
      <circle cx="69" cy="58" r="29" fill="#ff644d" opacity=".14"/><path d="M69 37 L91 78 H47 Z" fill="none" stroke="#ff735e" stroke-width="4"/><line x1="69" y1="50" x2="69" y2="64" stroke="#ff735e" stroke-width="4"/><circle cx="69" cy="71" r="2.5" fill="#ff735e"/>
      <text x="69" y="110" text-anchor="middle" fill="#ff8f7a" font-family="Arial,sans-serif" font-size="15" font-weight="800">REVIEW</text>
      <text x="69" y="134" text-anchor="middle" fill="#aac8cc" font-family="Arial,sans-serif" font-size="11">SITE SIGNAL</text>
    </g>

    <g transform="translate(28 265)">
      <rect width="444" height="78" rx="16" fill="#0d1c24"/>
      <g font-family="Arial,sans-serif"><text x="20" y="24" fill="#7b9da3" font-size="11">PH</text><text x="115" y="24" fill="#7b9da3" font-size="11">TURBIDITY</text><text x="245" y="24" fill="#7b9da3" font-size="11">DISSOLVED O₂</text><text x="372" y="24" fill="#7b9da3" font-size="11">COND.</text></g>
      <g fill="#66d5d9"><circle cx="36" cy="51" r="7"/><circle cx="151" cy="51" r="7"/><circle cx="284" cy="51" r="7"/><circle cx="401" cy="51" r="7"/></g>
      <g stroke="#55757c" stroke-width="5" stroke-linecap="round"><line x1="52" y1="51" x2="92" y2="51"/><line x1="167" y1="51" x2="208" y2="51"/><line x1="300" y1="51" x2="337" y2="51"/><line x1="417" y1="51" x2="428" y2="51"/></g>
    </g>

    <g transform="translate(28 366)">
      <rect width="444" height="220" rx="18" fill="#0b1921"/>
      <text x="20" y="28" fill="#a7c8cd" font-family="Arial,sans-serif" font-size="13" font-weight="700">WATER QUALITY TRENDS</text>
      <g stroke="#34505a" stroke-opacity=".45" stroke-width="1"><line x1="34" y1="58" x2="420" y2="58"/><line x1="34" y1="98" x2="420" y2="98"/><line x1="34" y1="138" x2="420" y2="138"/><line x1="34" y1="178" x2="420" y2="178"/></g>
      <path d="M36 150 C78 142 90 131 126 136 S184 122 222 129 S278 104 314 112 S352 95 392 103" fill="none" stroke="#5ecfd3" stroke-width="4"/>
      <path d="M36 122 C80 118 93 114 126 119 S179 111 219 116 S272 116 314 110 S348 92 392 82" fill="none" stroke="#8cb7ff" stroke-width="3"/>
      <path d="M36 165 C78 160 96 154 130 160 S182 149 220 156 S273 144 314 150 S349 152 392 76" fill="none" stroke="#ff745d" stroke-width="4"/>
      <circle cx="392" cy="76" r="9" fill="#ff745d" filter="url(#glow)"/>
      <text x="315" y="58" fill="#ff8e79" font-family="Arial,sans-serif" font-size="11" font-weight="700">ANOMALY</text>
    </g>

    <g transform="translate(28 607)">
      <rect width="444" height="55" rx="14" fill="#12242d"/>
      <text x="18" y="21" fill="#809fa5" font-family="Arial,sans-serif" font-size="11">WORKFLOW</text>
      <text x="18" y="41" fill="#e8f7f7" font-family="Arial,sans-serif" font-size="13" font-weight="700">MONITOR → DETECT → INVESTIGATE</text>
      <circle cx="410" cy="28" r="8" fill="#67d7da"/><circle cx="410" cy="28" r="16" fill="none" stroke="#67d7da" stroke-opacity=".35"/>
    </g>
  </g>
</svg>