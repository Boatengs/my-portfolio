<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Delta Air Lines FP and A model</title>
  <desc id="desc">Portfolio visual for the Delta Air Lines FP and A project: mainline revenue per seat mile rose 16 percent from 2019 to 2025 while cost per seat mile excluding fuel rose 36 percent, and mainline operating margin fell from 15.1 to 4.7 percent.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="46" y="42" width="1108" height="591" rx="28" fill="#f8fafb" stroke="#dbe5e8" stroke-width="2"/>
  <text x="88" y="108" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="4" fill="#b42318">DELTA FP&amp;A</text>
  <text x="88" y="157" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#17252a">Seven drivers · public filings · scenarios</text>
  <text x="88" y="191" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5f7078">SEC CompanyFacts · DOT Form 41 · BTS T-100 · 2019 to 2026</text>
  <g transform="translate(88 246)">
    <line x1="0" y1="260" x2="680" y2="260" stroke="#cfdadd" stroke-width="2"/>
    <line x1="0" y1="205" x2="680" y2="205" stroke="#e5ecee" stroke-width="1"/>
    <text x="686" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#98a8ad">5¢</text>
    <line x1="0" y1="150" x2="680" y2="150" stroke="#e5ecee" stroke-width="1"/>
    <text x="686" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#98a8ad">10¢</text>
    <line x1="0" y1="95" x2="680" y2="95" stroke="#e5ecee" stroke-width="1"/>
    <text x="686" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#98a8ad">15¢</text>
    <line x1="0" y1="40" x2="680" y2="40" stroke="#e5ecee" stroke-width="1"/>
    <text x="686" y="45" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#98a8ad">20¢</text>
    <rect x="60" y="87" width="100" height="173" rx="8" fill="#d6dde0"/>
    <text x="110" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17252a">15.73¢</text>
    <text x="110" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6c7b81">2019</text>
    <rect x="180" y="60" width="100" height="200" rx="8" fill="#17252a"/>
    <text x="230" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17252a">18.19¢</text>
    <text x="230" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6c7b81">2025</text>
    <text x="170" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#17252a">TRASM +16%</text>
    <rect x="390" y="145" width="100" height="115" rx="8" fill="#d6dde0"/>
    <text x="440" y="133" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17252a">10.46¢</text>
    <text x="440" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6c7b81">2019</text>
    <rect x="510" y="104" width="100" height="156" rx="8" fill="#b42318"/>
    <text x="560" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17252a">14.21¢</text>
    <text x="560" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6c7b81">2025</text>
    <text x="500" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#17252a">CASM ex fuel +36%</text>
    <text x="0" y="342" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5f7078">Mainline revenue and cost per available seat mile</text>
  </g>
  <g transform="translate(830 246)">
    <rect y="0" width="282" height="108" rx="18" fill="#ffffff" stroke="#dbe5e8" stroke-width="2"/>
    <text x="24" y="42" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#b42318">15.1% to 4.7%</text>
    <text x="24" y="72" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17252a">MAINLINE MARGIN</text>
    <text x="24" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6c7b81">2019 to 2025</text>
    <rect y="128" width="282" height="108" rx="18" fill="#ffffff" stroke="#dbe5e8" stroke-width="2"/>
    <text x="24" y="170" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#b42318">3.96%</text>
    <text x="24" y="200" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17252a">BACKTEST REVENUE ERROR</text>
    <text x="24" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6c7b81">34 forecasts, 1 to 4 quarters</text>
    <rect y="256" width="282" height="108" rx="18" fill="#17252a"/>
    <text x="24" y="298" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#ffffff">100.0%</text>
    <text x="24" y="328" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">FORM 41 MATCHES SEC</text>
    <text x="24" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#c8d3d6">to 100.4% in every quarter</text>
  </g>
</svg>
