name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Attach capability atlas design
        shell: bash
        run: |
          find site-static -type f -name '*.html' -print0 | while IFS= read -r -d '' file; do
            sed -i 's/modern-white-20260822.css?v=9/modern-white-20260822.css?v=10/g' "$file"
            if ! grep -q 'skills-atlas-20260823.css' "$file"; then
              sed -i 's#</head>#<link rel="stylesheet" href="/my-portfolio/assets/skills-atlas-20260823.css?v=1"/></head>#' "$file"
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
