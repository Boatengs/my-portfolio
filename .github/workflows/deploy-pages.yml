name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Apply live skills design layer
        run: |
          printf '\n\n' >> site-static/assets/modern-white-20260822.css
          cat site-static/assets/skills-premium-live.css >> site-static/assets/modern-white-20260822.css
          find site-static -type f -name '*.html' -exec sed -i 's/modern-white-20260822.css?v=9/modern-white-20260822.css?v=10/g' {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
