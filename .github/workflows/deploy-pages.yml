name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare portfolio project visuals
        run: node scripts/prepare-pages-featured-projects.mjs
      - name: Persist portfolio project visuals
        run: |
          if ! git diff --quiet -- site-static/index.html site-static/work/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site-static/index.html site-static/work/index.html
            git commit -m "Sync structured project visuals [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
