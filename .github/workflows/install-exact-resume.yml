name: Install exact resume binary

on:
  push:
    branches:
      - fix/exact-resume-20260908
    paths:
      - ".resume-upload/**"
      - ".github/workflows/install-exact-resume.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/exact-resume-20260908
          fetch-depth: 0

      - name: Reconstruct and verify exact resume
        shell: bash
        run: |
          set -euo pipefail
          cat .resume-upload/*.gz.b64 | base64 --decode | gzip --decompress > public/sampson-boateng-resume.pdf
          test "$(wc -c < public/sampson-boateng-resume.pdf | tr -d ' ')" = "111830"
          echo "79c59994d36b8fac11037835dd9cc75e3775c591cb88d8514f57f66aec51ae57  public/sampson-boateng-resume.pdf" | sha256sum --check -
          test "$(git hash-object public/sampson-boateng-resume.pdf)" = "ba64a4543f2c24b898bd5133ea55521db8a036ce"

      - name: Commit exact resume
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/sampson-boateng-resume.pdf; then
            echo "Resume already matches the uploaded file."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sampson-boateng-resume.pdf
          git commit -m "Install exact uploaded September 8 resume PDF"
          git push origin HEAD:fix/exact-resume-20260908
