name: Apply static first-load asset fix

on:
  push:
    branches:
      - fix/static-first-load-assets

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/static-first-load-assets
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply first-load reliability patch
        run: python scripts/apply-static-first-load-fix.py
      - name: Commit patched canonical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix first-load static assets and navigation"
          git push origin HEAD:fix/static-first-load-assets
