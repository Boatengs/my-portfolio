name: Single Source Migration

on:
  push:
    branches: [refactor/single-source-portfolio]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build canonical app export
        run: npm run build
      - name: Verify current live routes are not lost
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';

          function indexRoutes(root) {
            const routes = [];
            function walk(directory) {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const full = path.join(directory, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.isFile() && entry.name === 'index.html') {
                  const relative = path.relative(root, path.dirname(full));
                  routes.push(relative === '' ? '/' : `/${relative.replaceAll(path.sep, '/')}/`);
                }
              }
            }
            walk(root);
            return routes.sort();
          }

          const liveRoutes = indexRoutes('site-static');
          const generatedRoutes = new Set(indexRoutes('out'));
          const missing = liveRoutes.filter((route) => !generatedRoutes.has(route));
          if (missing.length) throw new Error(`Canonical export is missing live routes: ${missing.join(', ')}`);
          console.log(`Preserved all ${liveRoutes.length} currently live routes before duplicate-folder removal.`);
          EOF
      - name: Validate canonical portfolio export
        run: node scripts/validate-portfolio-export.mjs
