name: Single Source Migration

on:
  push:
    branches: [refactor/single-source-portfolio]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build canonical app export
        run: npm run build
      - name: Show generated routes
        run: |
          echo "Generated HTML routes:"
          find out -name index.html -o -name 404.html | sort
      - name: Verify every currently live route is preserved
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';

          function indexRoutes(root) {
            const routes = [];
            function walk(directory) {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const full = path.join(directory, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.isFile() && entry.name === 'index.html') {
                  const relative = path.relative(root, path.dirname(full));
                  routes.push(relative === '' ? '/' : `/${relative.replaceAll(path.sep, '/')}/`);
                }
              }
            }
            walk(root);
            return routes.sort();
          }

          const liveRoutes = indexRoutes('site-static');
          const generatedRoutes = new Set(indexRoutes('out'));
          const missing = liveRoutes.filter((route) => !generatedRoutes.has(route));
          if (missing.length) {
            throw new Error(`Canonical export is missing live routes: ${missing.join(', ')}`);
          }
          console.log(`Preserved all ${liveRoutes.length} currently live index routes.`);
          EOF
      - name: Verify protected presentation pages
        run: |
          test -f out/projects/world-happiness-analysis/index.html
          grep -q "World Happiness" out/projects/world-happiness-analysis/index.html
          grep -q "world-happiness-dashboard.js" out/projects/world-happiness-analysis/index.html

          grep -q "PFAS Drinking Water Decision Intelligence" out/projects/pfas-water-decision-intelligence/index.html
          grep -q "pfas-responsive.css?v=3" out/projects/pfas-water-decision-intelligence/index.html
          grep -q 'class="mobile-nav"' out/projects/pfas-water-decision-intelligence/index.html

          grep -q "THE PERSON BEHIND THE WORK" out/person/index.html
          grep -q "sam-beyond-work.webp" out/person/index.html
          grep -q "portfolio-responsive.css?v=3" out/person/index.html
          grep -q 'class="mobile-nav"' out/person/index.html

          grep -q "world-happiness-analysis" out/work/index.html
      - name: Verify GitHub Pages asset paths
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';

          const htmlFiles = [];
          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.html')) htmlFiles.push(full);
            }
          }
          walk('out');

          const badRootUrls = [];
          const missingAssets = [];
          const assetExt = /\.(?:css|js|mjs|png|webp|jpe?g|svg|pdf|ico|woff2?)(?:$|[?#])/i;

          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            for (const match of html.matchAll(/(?:src|href)=["'](\/[^"']*)["']/g)) {
              const url = match[1];
              if (!(url === '/my-portfolio' || url.startsWith('/my-portfolio/'))) {
                badRootUrls.push(`${file}: ${url}`);
                continue;
              }

              const pathname = url.split(/[?#]/, 1)[0];
              if (assetExt.test(pathname)) {
                const relative = pathname.replace(/^\/my-portfolio\/?/, '');
                if (!fs.existsSync(path.join('out', relative))) {
                  missingAssets.push(`${file}: ${url}`);
                }
              }
            }
          }

          if (badRootUrls.length) {
            throw new Error(`Root-relative URLs bypass GitHub Pages base path:\n${badRootUrls.join('\n')}`);
          }
          if (missingAssets.length) {
            throw new Error(`Referenced static assets are missing from export:\n${missingAssets.join('\n')}`);
          }
          console.log(`Validated base-path and static asset references across ${htmlFiles.length} HTML files.`);
          EOF
      - name: Verify core generated pages
        run: |
          test -f out/index.html
          test -f out/work/index.html
          test -f out/skills/index.html
          test -f out/leadership/index.html
          test -f out/impact/index.html
          test -f out/person/index.html
          test -f out/resume/index.html
          test -f out/projects/pfas-water-decision-intelligence/index.html
          test -f out/projects/wastewater-infrastructure-analytics/index.html
          test -f out/projects/world-happiness-analysis/index.html
