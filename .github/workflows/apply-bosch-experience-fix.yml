name: Apply Bosch experience fix

on:
  push:
    branches:
      - fix/bosch-resume-title
    paths:
      - ".github/workflows/apply-bosch-experience-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/bosch-resume-title
          fetch-depth: 0

      - name: Align homepage Bosch experience
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- scripts/validate-palette-portrait.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/page.tsx")
          text = path.read_text()
          pattern = re.compile(
              r'<h3>Programmer Intern</h3>\s*'
              r'<h4>Bosch Techno-Engineering Ltd</h4>\s*'
              r'<p>\s*'
              r'Supported development and QA cycles, diagnosed defects, helped\s*'
              r'improve system stability by 20%, and built an internal\s*'
              r'encryption and decryption testing utility\.\s*'
              r'</p>'
          )
          replacement = '''<h3>Software Engineer Intern</h3>
              <h4>Bosch Techno-Engineering Ltd</h4>
              <p>
                Improved system stability by 20% through structured debugging,
                defect resolution, performance tuning, and validation across
                software development and testing cycles. Designed and developed
                an internal encryption and decryption testing tool to verify data
                integrity and reinforce security practices. Wrote test cases,
                validated functionality, and documented results to support
                reliable end to end software delivery.
              </p>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one Bosch homepage block; replaced {count}")
          path.write_text(text)
          PY
          rm .github/workflows/apply-bosch-experience-fix.yml

      - name: Commit cleaned Bosch experience update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx scripts/validate-palette-portrait.mjs .github/workflows/apply-bosch-experience-fix.yml
          git commit -m "Align Bosch experience wording on homepage"
          git push origin HEAD:fix/bosch-resume-title
